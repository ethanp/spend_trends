# PowerSync Open Edition Configuration for spend_trends

replication:
  connections:
    - type: postgresql
      hostname: postgres
      port: 5432
      database: spend_trends
      username: spend_trends
      password: !env PS_PG_PASSWORD
      sslmode: disable
      id: spend_trends

storage:
  type: postgresql
  hostname: postgres
  port: 5432
  database: spend_trends
  username: spend_trends
  password: !env PS_PG_PASSWORD
  sslmode: disable

client_auth:
  jwks:
    keys:
      - kty: oct
        kid: spend-trends-dev-key
        k: !env PS_JWT_KEY
        alg: HS256
  audience:
    - powersync

sync_rules:
  content: |
    bucket_definitions:
      spend_trends_global:
        priority: 0
        data:
          - SELECT * FROM accounts
          - SELECT * FROM category_groups
          - SELECT * FROM categories
          - SELECT * FROM transactions
          - SELECT * FROM categorization_rules
          - SELECT * FROM life_events
          - SELECT * FROM housing_stays
          - SELECT * FROM job_stays
          - SELECT * FROM sync_state
          - SELECT * FROM simplefin_pulls
          - SELECT * FROM simplefin_pull_accounts
          - SELECT * FROM owned_assets
          - SELECT * FROM owned_asset_valuations
          - SELECT * FROM projection_settings
          - SELECT * FROM account_balance_snapshots
          - SELECT * FROM imported_net_worth_days
